# =============================================================================
# docker-compose.staging.yml — Staging environment overlay
# =============================================================================
services:
  app-staging:
    build:
      context: ..
      dockerfile: devops/docker/Dockerfile
      target: production
      args:
        - NODE_ENV=staging
    image: ${REGISTRY:-ghcr.io}/${REPOSITORY:-inomtechs/inomtechs-site}:staging
    container_name: inomtechs-staging
    restart: unless-stopped
    ports:
      - "8080:80"
    env_file:
      - ../.env.staging
    environment:
      - NODE_ENV=staging
    volumes:
      - nginx-logs-staging:/var/log/nginx
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - staging-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

networks:
  staging-network:
    driver: bridge

volumes:
  nginx-logs-staging:
    driver: local
