user appuser;
worker_processes auto;
pid /var/run/nginx.pid;
worker_rlimit_nofile 65535;

events {
    multi_accept on;
    worker_connections 65535;
    use epoll;
}

http {
    # =========================================================================
    # Basic Settings
    # =========================================================================
    charset utf-8;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    server_tokens off;
    log_not_found off;
    types_hash_max_size 2048;
    client_max_body_size 10M;

    # =========================================================================
    # MIME Types
    # =========================================================================
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # =========================================================================
    # Logging — JSON structured for Loki
    # =========================================================================
    log_format json_analytics escape=json '{'
        '"timestamp":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"remote_user":"$remote_user",'
        '"request_id":"$request_id",'
        '"request_method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"http_x_forwarded_for":"$http_x_forwarded_for",'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_status":"$upstream_status",'
        '"upstream_response_time":"$upstream_response_time"'
    '}';

    access_log /var/log/nginx/access.log json_analytics buffer=32k flush=5s;
    error_log /var/log/nginx/error.log warn;

    # =========================================================================
    # Includes
    # =========================================================================
    include /etc/nginx/security-headers.conf;
    include /etc/nginx/rate-limiting.conf;
    include /etc/nginx/gzip.conf;

    # =========================================================================
    # Upstreams (for future API backend)
    # =========================================================================
    upstream api_server {
        least_conn;
        server api:3001 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # =========================================================================
    # HTTPS Server (default)
    # =========================================================================
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name inomtechs.com www.inomtechs.com;

        # SSL — Let's Encrypt (certbot) or cloud-provider-managed
        ssl_certificate     /etc/ssl/certs/fullchain.pem;
        ssl_certificate_key /etc/ssl/private/privkey.pem;
        ssl_trusted_certificate /etc/ssl/certs/chain.pem;

        # Modern SSL config (Mozilla Intermediate)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 1.1.1.1 8.8.8.8 valid=300s;
        resolver_timeout 5s;

        # HSTS (HTTP Strict Transport Security)
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        # =====================================================================
        # Root — serve SPA
        # =====================================================================
        root /usr/share/nginx/html;
        index index.html;

        # =====================================================================
        # Static asset caching (fingerprinted files)
        # =====================================================================
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable, no-transform";
            access_log off;
            try_files $uri =404;
        }

        # =====================================================================
        # Favicon / robots / sitemap
        # =====================================================================
        location = /favicon.ico {
            log_not_found off;
            access_log off;
            expires 30d;
        }
        location = /robots.txt  { access_log off; log_not_found off; }
        location = /sitemap.xml { access_log off; log_not_found off; }
        location ~ /\.(?:env|git|htaccess)$ { deny all; }

        # =====================================================================
        # API proxy (future Express backend)
        # =====================================================================
        location /api/ {
            proxy_pass http://api_server;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            proxy_buffering off;
        }

        # =====================================================================
        # SPA fallback — serve index.html for all routes
        # =====================================================================
        location / {
            try_files $uri $uri/ /index.html;
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        # =====================================================================
        # Health check endpoint
        # =====================================================================
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # =====================================================================
        # Metrics (restrict internally)
        # =====================================================================
        location /metrics {
            deny all;
            return 404;
        }
    }

    # =========================================================================
    # HTTP — redirect all to HTTPS
    # =========================================================================
    server {
        listen 80;
        listen [::]:80;
        server_name inomtechs.com www.inomtechs.com;

        # ACME challenge (Let's Encrypt)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # =========================================================================
    # Catch-all — reject unknown hosts
    # =========================================================================
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;
        return 444;
    }
}
