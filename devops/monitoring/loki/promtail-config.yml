# Promtail config — ships logs to Loki
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: nginx
    static_configs:
      - targets: [localhost]
        labels:
          job: nginx
          __path__: /var/log/nginx/*.log
    pipeline_stages:
      - regex:
          expression: '^{"timestamp":"(?P<timestamp>[^"]+)","remote_addr":"(?P<remote_addr>[^"]+)","request_method":"(?P<request_method>[^"]+)","request_uri":"(?P<request_uri>[^"]+)","status":(?P<status>\d+),.*'
      - labels:
          status:
          request_method:

  - job_name: docker
    pipeline_stages:
      - docker: {}
    static_configs:
      - targets: [localhost]
        labels:
          job: docker
          __path__: /var/lib/docker/containers/*/*.log

  - job_name: system
    static_configs:
      - targets: [localhost]
        labels:
          job: system
          __path__: /var/log/syslog
