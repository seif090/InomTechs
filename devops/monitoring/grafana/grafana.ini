[server]
domain = monitoring.inomtechs.com
root_url = https://monitoring.inomtechs.com
enable_gzip = true

[security]
admin_user = ${GRAFANA_ADMIN_USER}
admin_password = ${GRAFANA_ADMIN_PASSWORD}

[database]
type = sqlite3
path = grafana.db

[users]
default_language = en-US
allow_sign_up = false
auto_assign_org_role = Viewer

[auth.anonymous]
enabled = false

[alerting]
enabled = true
execute_alerts = true

[metrics]
enabled = true
interval_seconds = 10

[log]
level = warn
mode = console

[snapshots]
enabled = false
