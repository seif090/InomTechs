apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: inomtechs
type: Opaque
stringData:
  GEMINI_API_KEY: "your-gemini-api-key-here"
  SESSION_SECRET: "your-session-secret-here"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nginx-logs-pvc
  namespace: inomtechs
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: app-pdb
  namespace: inomtechs
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: inomtechs
      tier: frontend
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: app-network-policy
  namespace: inomtechs
spec:
  podSelector:
    matchLabels:
      app: inomtechs
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - port: 443
          protocol: TCP
        - port: 80
          protocol: TCP
